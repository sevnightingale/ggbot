version: "3.8"

services:
  # Hummingbot Backend API - Central orchestration service
  hummingbot-api:
    image: hummingbot/hummingbot-api:latest  # Use latest - matches worker version
    container_name: hummingbot-backend-api
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@hummingbot-postgres:5432/hummingbot_db
      - PAPER_TRADE=true
      - LOG_LEVEL=INFO
      - USERNAME=admin
      - PASSWORD=admin
      - DEBUG_MODE=false
    volumes:
      - ./hummingbot_data:/home/hummingbot  # Bind mount to host directory
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for container management
    restart: unless-stopped
    ports:
      - "15888:8000"
    depends_on:
      - hummingbot-postgres
    networks:
      - ggbot-network

  # Hummingbot Worker - Where paper trading simulation happens
  hummingbot-worker:
    image: hummingbot/hummingbot:latest  # Use latest client version  
    container_name: hummingbot-worker
    volumes:
      - ./hummingbot_data/conf:/home/hummingbot/conf
      - ./hummingbot_data/logs:/home/hummingbot/logs
      - ./hummingbot_data/data:/home/hummingbot/data
      - ./hummingbot_data/certs:/home/hummingbot/certs
      - ./hummingbot_data/scripts:/home/hummingbot/scripts
    environment:
      - HUMMINGBOT_PASSWORD=ggbot123
      - HUMMINGBOT_API_URL=http://hummingbot-api:8000
    depends_on:
      - hummingbot-api
    restart: unless-stopped
    networks:
      - ggbot-network

  # PostgreSQL for Hummingbot (separate from main ggbot DB)
  hummingbot-postgres:
    image: postgres:13-alpine
    container_name: hummingbot-postgres
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=hummingbot_db
    volumes:
      - hummingbot_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Different port to avoid conflict
    networks:
      - ggbot-network

networks:
  ggbot-network:
    driver: bridge

volumes:
  hummingbot_postgres_data: