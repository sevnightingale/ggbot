name: ggshot_signals
category: signals
description: Latest ggShot trading signals across all timeframes for a symbol

query_params:
  symbol:
    type: string
    required: true
    description: Trading pair symbol (e.g., BTC/USDT)
    example: BTC/USDT

  include_raw:
    type: boolean
    required: false
    default: false
    description: Include raw Telegram message text

sources:
  - adapter: ggshot_adapter
    priority: 1
    required_env: []
    cost: free
    rate_limit: null

cache:
  backend: redis
  ttl: 300  # 5 minutes - signals don't update that frequently
  key_pattern: "ggshot_signals:{symbol}"

response_schema:
  type: object
  description: Map of timeframe to latest signal data
  properties:
    signals:
      type: object
      description: Signals keyed by timeframe
      additionalProperties:
        type: object
        properties:
          direction:
            type: string
            enum: [LONG, SHORT]
          entry_zone:
            type: object
            properties:
              low:
                type: number
              high:
                type: number
              mid:
                type: number
          stop_loss:
            type: number
          take_profit:
            type: number
          targets:
            type: array
            items:
              type: object
              properties:
                number:
                  type: integer
                price:
                  type: number
          confidence:
            type: number
            description: Strategy accuracy as decimal (0.0-1.0)
          strategy_accuracy:
            type: integer
            description: Strategy accuracy as percentage
          trend_line:
            type: number
            nullable: true
          timestamp:
            type: string
            format: date-time
          raw_message:
            type: string
            nullable: true

    metadata:
      type: object
      properties:
        symbol:
          type: string
        timeframes_found:
          type: array
          items:
            type: string
        latest_signal_age:
          type: string
          description: Age of most recent signal
        query_timestamp:
          type: string
          format: date-time

agent_format:
  summary: |
    ggShot Signals for {symbol}:
    {% for tf, signal in signals.items() %}
    - {{ tf }}: {{ signal.direction }} @ {{ signal.entry_zone.mid }} ({{ signal.strategy_accuracy }}% confidence)
      Entry: {{ signal.entry_zone.low }}-{{ signal.entry_zone.high }}
      SL: {{ signal.stop_loss }}, TP: {{ signal.take_profit }}
      Age: {{ signal.timestamp }}
    {% endfor %}

    Total timeframes with signals: {{ metadata.timeframes_found|length }}

  insights: |
    Key Observations:
    {% set directions = signals.values()|map(attribute='direction')|list %}
    {% set long_count = directions|select('equalto', 'LONG')|list|length %}
    {% set short_count = directions|select('equalto', 'SHORT')|list|length %}

    - Directional Bias: {{ long_count }} LONG vs {{ short_count }} SHORT signals
    {% if long_count > short_count %}
    - ggShot favors LONG across timeframes
    {% elif short_count > long_count %}
    - ggShot favors SHORT across timeframes
    {% else %}
    - ggShot shows mixed signals across timeframes
    {% endif %}

    {% set avg_confidence = (signals.values()|map(attribute='strategy_accuracy')|sum / signals|length)|round(1) %}
    - Average confidence: {{ avg_confidence }}%

    {% if avg_confidence >= 85 %}
    - HIGH confidence signals
    {% elif avg_confidence >= 70 %}
    - MODERATE confidence signals
    {% else %}
    - LOWER confidence signals - use caution
    {% endif %}

examples:
  - description: Get latest ggShot signals for BTC across all timeframes
    params:
      symbol: BTC/USDT
    expected_timeframes: [5m, 30m, 1h, 4h]

  - description: Get ggShot signals for ETH with raw messages
    params:
      symbol: ETH/USDT
      include_raw: true

data_quality:
  latency_target: 100ms
  freshness_target: 5min
  confidence_threshold: 0.0
