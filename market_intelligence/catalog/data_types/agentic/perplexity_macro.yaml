name: perplexity_macro
category: agentic
description: Macro economic indicators via Perplexity Sonar Pro (native web search)

query_params:
  query_type:
    type: string
    required: true
    description: |
      Type of macro data to gather. Options:
      - vix_index: VIX volatility index
      - dxy_index: US Dollar strength index
      - cpi_inflation: Latest CPI inflation data
      - nfp_jobs: Latest jobs report

  symbol:
    type: string
    required: false
    description: Cryptocurrency symbol (e.g., BTC, ETH) - optional context

sources:
  - adapter: OpenRouterMarketAdapter
    priority: 1
    cost: variable  # ~$0.01-0.05 per query (Perplexity Sonar Pro)

cache:
  backend: redis
  ttl: 3600  # 1 hour default
