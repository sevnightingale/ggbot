name: grok_agentic
category: agentic
description: Twitter sentiment and on-chain analytics via Grok's agentic API (native X access, web search, code execution)

query_params:
  query_type:
    type: string
    required: true
    description: |
      Type of intelligence to gather. Options:
      - twitter_sentiment: Twitter/X sentiment analysis (requires symbol)
      - crypto_news: Recent crypto news headlines (requires symbol)
      - btc_tvl: Bitcoin Total Value Locked in DeFi
      - whale_activity: Whale transaction analysis (requires symbol)

  symbol:
    type: string
    required: false
    description: Cryptocurrency symbol (e.g., BTC, ETH) - required for symbol-specific queries

sources:
  - adapter: GrokAgenticAdapter
    priority: 1
    cost: variable  # $0.05-0.15 per query (XAI Agentic API)

cache:
  backend: redis
  ttl: 14400  # 4 hours default - extended to reduce API costs
  key_pattern: "intel:grok:{query_type}:{symbol}"  # Include query_type to avoid key collisions
