name: acp_agent
category: acp
description: Intelligence from curated Virtuals ACP agents (crypto news, risk scores, prediction markets, market briefs)

query_params:
  agent_name:
    type: string
    required: true
    description: Agent identifier (e.g., 'ggbots', 'otto_ai')

  agent_address:
    type: string
    required: true
    description: ACP smart wallet address

  offering_name:
    type: string
    required: true
    description: Job offering name (e.g., 'marketBrief', 'crypto_news')

  service_requirement:
    type: object
    required: false
    description: What to ask the agent for (focus, bot_id, etc.)

sources:
  - adapter: ACPAgentAdapter
    priority: 1
    cost: variable
    notes: $0.01-0.07 per ACP job, cached 1hr+

cache:
  backend: redis
  ttl: 3600
  key_pattern: "intel:acp:{agent_name}"
